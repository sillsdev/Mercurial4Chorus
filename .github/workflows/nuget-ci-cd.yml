# This is a basic workflow to help you get started with Actions

name: Nuget-CI-CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Cancel any workflow jobs running if the PR is re-triggered
concurrency:
  group: ci-${{ github.head_ref }}-group
  cancel-in-progress: true

jobs:
  build-python:
    # Use specific Ubuntu version rather than ubuntu-latest, so we can control when to upgrade the runner
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mercurial-version:
          - "7.0.1"
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14.0-beta.4"
    outputs:
      mercurial-version: ${{ steps.output-version.outputs.mercurial-version }}
    steps:
    - name: Record Mercurial version in job output
      id: output-version
      run: echo "mercurial-version=${{ matrix.mercurial-version }}" >> "$GITHUB_OUTPUT"
    - name: Setup Python
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install Python setuptools
      run: pip install setuptools
    - name: Checkout Mercurial
      run: hg clone https://foss.heptapod.net/mercurial/mercurial-devel hg
    - name: Checkout hg version to build
      run: hg checkout "${VER}"
      working-directory: hg
      env:
        VER: ${{ matrix.mercurial-version }}
    - name: Build chg
      run: make
      working-directory: hg/contrib/chg
    - name: Build Mercurial
      run: make local
      working-directory: hg
    - name: Delete .hg folder prior to upload
      run: rm -rf .hg
      working-directory: hg
    - name: Move chg binary next to hg prior to upload
      run: mv contrib/chg/chg .
      working-directory: hg
    - name: Set executable bit on hg and chg binaries before upload
      run: chmod +x hg chg
      working-directory: hg
    - name: Remove files that cause issues on ASP.NET projects
      # -f option to rm means it won't fail even if file does not exist
      run: rm -f contrib/vs2022-settings.json contrib/asv.conf.json
      working-directory: hg
    - name: Upload Mercurial build results
      uses: actions/upload-artifact@1746f4ab65b179e0ea60a494b83293b640dd5bba # v4.3.2
      with:
        name: hg-for-python-${{ matrix.python-version }}
        path: |
          hg/contrib
          hg/COPYING
          hg/chg
          hg/hg
          hg/hgdemandimport
          hg/hgext
          hg/mercurial
        if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: build-python
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set Beta Version
      if: github.event_name != 'push'
      run: echo "RELEASE_SUFFIX=-beta." >> $GITHUB_ENV
    - name: Set Release Version
      if: github.event_name == 'push'
      run: echo "RELEASE_SUFFIX=." >> $GITHUB_ENV
    - name: Set Package Version
      run: |
        echo "PackageVersion=${{ needs.build-python.outputs.mercurial-version }}${RELEASE_SUFFIX}${{github.run_number}}"
        echo "PackageVersion=${{ needs.build-python.outputs.mercurial-version }}${RELEASE_SUFFIX}${{github.run_number}}" >> $GITHUB_ENV

    - name: Download Mercurial builds
      uses: actions/download-artifact@v4
      with:
        path: linux-x64/Mercurial
        pattern: hg-for-python-*
        merge-multiple: true

    - name: See if executable bit was preserved
      run: ls -l linux-x64/Mercurial

    - name: Set executable bit on hg and chg binaries again to work around download-artifact bug
      run: chmod +x linux-x64/Mercurial/hg linux-x64/Mercurial/chg

    - name: Nuget pack
      run: dotnet pack -p:PackageVersion=$PackageVersion

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: ./artifacts/package/release/*.nupkg
        if-no-files-found: error

    - name: Publish nuget packages
      if: github.event_name == 'push'
      run: dotnet nuget push artifacts/package/release/*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{ secrets.SILLSDEV_PUBLISH_NUGET_ORG }}
