# This is a basic workflow to help you get started with Actions

name: Nuget-CI-CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Cancel any workflow jobs running if the PR is re-triggered. head_ref is empty
# on a push, so without the run_id fallback every push to master would share one
# group and cancel the one before it -- possibly mid nuget push.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}-group
  cancel-in-progress: true

jobs:
  build-python:
    # Use specific Ubuntu version rather than ubuntu-latest, so we can control when to upgrade the runner
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mercurial-version:
          - "7.2.4"
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          # Update this to 3.15 once it's officially released (planned for 2026-10-01)
          - "3.15.0-rc.2"
    outputs:
      mercurial-version: ${{ steps.output-version.outputs.mercurial-version }}
    steps:
    - name: Record Mercurial version in job output
      id: output-version
      run: echo "mercurial-version=${{ matrix.mercurial-version }}" >> "$GITHUB_OUTPUT"
    - name: Setup Python
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install Python setuptools
      run: pip install setuptools
    # Starting from Mercurial 7.2, `make local` needs `uv` to run. We pin `uv`
    # version so we can't be automatically upgraded to a compromised package;
    # update this to the latest known-good version each time we bump Mercurial.
    - name: Install uv
      run: pip install uv==0.12.19
    - name: Checkout Mercurial
      run: hg clone https://foss.heptapod.net/mercurial/mercurial-devel hg
    - name: Checkout hg version to build
      run: hg checkout "${VER}"
      working-directory: hg
      env:
        VER: ${{ matrix.mercurial-version }}
    - name: Build chg
      run: make
      working-directory: hg/contrib/chg
    - name: Build Mercurial
      run: make local
      working-directory: hg
    - name: Check the C extensions were built for this Python
      # The package's Linux side works only through the .so files built here,
      # and nothing downstream notices if there are none: the strip step below
      # finds nothing and succeeds. `make local` picks its interpreter with
      # `uv venv -p python3`, so this also checks that it found the one
      # setup-python installed rather than some other python3.
      run: |
        suffix=$(python -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))")
        found=$(find mercurial -name "*${suffix}" | wc -l)
        echo "${found} extension module(s) ending ${suffix}"
        test "${found}" -gt 0
      working-directory: hg
    - name: Delete .hg folder prior to upload
      run: rm -rf .hg
      working-directory: hg
    - name: Move chg binary next to hg prior to upload
      run: mv contrib/chg/chg .
      working-directory: hg
    - name: Strip debug symbols from chg binary
      run: strip --strip-unneeded chg
      working-directory: hg
    - name: Set executable bit on hg and chg binaries before upload
      run: chmod +x hg chg
      working-directory: hg
    - name: Strip debug symbols from compiled extensions
      run: find mercurial hgext -name '*.so' -exec strip --strip-unneeded {} +
      working-directory: hg
    - name: Upload Mercurial build results
      uses: actions/upload-artifact@1746f4ab65b179e0ea60a494b83293b640dd5bba # v4.3.2
      with:
        name: hg-for-python-${{ matrix.python-version }}
        path: |
          hg/COPYING
          hg/chg
          hg/hg
          hg/hgdemandimport
          hg/hgext
          hg/hgext3rd
          hg/mercurial
        if-no-files-found: error

  check-fixutf8-bytecode:
    # The committed fixutf8 .pyc must be PEP 552 checked-hash and match its
    # sources. A timestamp-based one records the source mtime, git does not
    # preserve mtimes, so it is rejected everywhere and hg recompiles the
    # extension on every invocation. Needs CPython 3.9 specifically: the source
    # hash is keyed by the interpreter's magic number, and 3.9 is what
    # rust/hgcli/pyoxidizer.bzl embeds.
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python 3.9
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
      with:
        python-version: "3.9"
    - name: Check the committed fixutf8 bytecode
      run: python check-fixutf8-bytecode.py

  test-build-payload:
    # The payload build's own tests. No Windows, no Mercurial checkout, no
    # network, and about a tenth of a second.
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python 3.9
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
      with:
        # The version rust/hgcli/pyoxidizer.bzl embeds, so the tests run on
        # what the payload runs on. Move this when the payload's Python moves.
        python-version: "3.9"
    - name: Run the payload build's tests
      # Invoked directly: the hyphen in the name means unittest discover
      # collects nothing and still exits 0.
      run: python test-build-windows-payload.py

  build:
    runs-on: ubuntu-latest
    needs: [build-python, check-fixutf8-bytecode, test-build-payload]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set Beta Version
      if: github.event_name != 'push'
      run: echo "RELEASE_SUFFIX=-beta." >> $GITHUB_ENV
    - name: Set Release Version
      if: github.event_name == 'push'
      run: echo "RELEASE_SUFFIX=." >> $GITHUB_ENV
    - name: Set Package Version
      run: |
        echo "PackageVersion=${{ needs.build-python.outputs.mercurial-version }}${RELEASE_SUFFIX}${{github.run_number}}"
        echo "PackageVersion=${{ needs.build-python.outputs.mercurial-version }}${RELEASE_SUFFIX}${{github.run_number}}" >> $GITHUB_ENV

    - name: Ensure stale files aren't packaged
      # chg binary has already been copied into root, and we need nothing else in contrib
      run: rm -rf linux-x64/Mercurial/contrib

    - name: Download Mercurial builds
      uses: actions/download-artifact@v4
      with:
        path: linux-x64/Mercurial
        pattern: hg-for-python-*
        merge-multiple: true

    - name: See if executable bit was preserved
      run: ls -l linux-x64/Mercurial

    - name: Set executable bit on hg and chg binaries again to work around download-artifact bug
      run: chmod +x linux-x64/Mercurial/hg linux-x64/Mercurial/chg

    - name: Nuget pack
      run: dotnet pack -c Release -p:PackageVersion=$PackageVersion

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: ./artifacts/package/release/*.nupkg
        if-no-files-found: error

    - name: Publish nuget packages
      if: github.event_name == 'push'
      run: dotnet nuget push artifacts/package/release/*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{ secrets.SILLSDEV_PUBLISH_NUGET_ORG }}
